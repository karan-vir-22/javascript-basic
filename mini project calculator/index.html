<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="calcu">
        <div class="screen"><input class="inpscreen" type="text"></div>
        <div class="btn">
            <div class="btn1">
                <div class="btclear"><button class="button">AC</button></div>
                <div class="bt"><button class="button">0</button></div>
                <div class="btmaths"><button class="button">/</button></div>
            </div>
            <div class="btn1">
                <div class="bt"><button class="button">9</button></div>
                <div class="bt"><button class="button">8</button></div>
                <div class="bt"><button class="button">7</button></div>
                <div class="btmaths"><button class="button">*</button></div>
            </div>
            <div class="btn1">
                <div class="bt"><button class="button">6</button></div>
                <div class="bt"><button class="button">5</button></div>
                <div class="bt"><button class="button">4</button></div>
                <div class="btmaths"><button class="button">-</button></div>
            </div>
            <div class="btn1">
                <div class="bt"><button class="button">3</button></div>
                <div class="bt"><button class="button">2</button></div>
                <div class="bt"><button class="button">1</button></div>
                <div class="btmaths"><button class="button">+</button></div>
            </div>
            <div class="btn1">
                <div class="btmaths"><button class="button">.</button></div>
                <div class="btmaths"><button class="button">%</button></div>
                <div class="btclear"><button class="button">=</button></div>
            </div>
        </div>
    </div>
    <script src="/mini project calculator/javascript.js"></script>

</html>
